<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comp AI</title>
    <style>
        body { font-family: sans-serif; background: #0b132b; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .card { background: #1c2541; padding: 25px; border-radius: 12px; max-width: 450px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; font-size: 24px; }
        .box { background: #0b132b; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="file"] { margin-top: 5px; width: 100%; color: white; }
        button { background: #00b4d8; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:disabled { background: #555; }
        #log { background: #000; color: #00ffcc; padding: 10px; border-radius: 6px; font-family: monospace; height: 120px; overflow-y: auto; font-size: 12px; margin-top: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎬 Comp AI</h1>
    <div class="box">
        <label>🎥 Maç Videosu Seç:</label>
        <input type="file" id="videoFile" accept="video/*">
        
        <label>🧑 Oyuncu Fotoğrafı Seç:</label>
        <input type="file" id="imageFile" accept="image/*">
    </div>

    <button id="startBtn" onclick="startProcess()">⚡ COMP'U BAŞLAT</button>

    <div id="log">[SYSTEM] Hazır...</div>
</div>

<script>
    // SUNUCU ADRESIN BURAYA GELECEK
    const SERVER_URL = "https://mycompai-app.loca.lt";

    function log(msg) {
        const l = document.getElementById("log");
        l.innerText += "\n" + msg;
        l.scrollTop = l.scrollHeight;
    }

    async function startProcess() {
        const video = document.getElementById("videoFile").files[0];
        const image = document.getElementById("imageFile").files[0];

        if (!video || !image) {
            alert("Lütfen hem video hem fotoğraf seçin!");
            return;
        }

        document.getElementById("startBtn").disabled = true;
        log("[START] Sunucuya bağlanılıyor...");

        try {
            const formData = new FormData();
            formData.append("video", video);
            formData.append("image", image);

            const res = await fetch(`${SERVER_URL}/process`, {
                method: "POST",
                headers: {
                    "Bypass-Tunnel-Reminder": "true",
                    "ngrok-skip-browser-warning": "true"
                },
                body: formData
            });

            if (!res.ok) throw new Error("Sunucu yanıt vermedi");

            const data = await res.json();
            log("[OK] İşlem başlatıldı! ID: " + data.job_id);

        } catch (err) {
            log("[ERROR] " + err.message);
            document.getElementById("startBtn").disabled = false;
        }
    }
</script>

</body>
</html>
